<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Wave Music — YouTube Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#101116;color:#fff;font-family:system-ui,sans-serif}
#player{width:100%;height:100%;min-height:240px}
#message{padding:18px;text-align:center}
#play-help{position:fixed;bottom:16px;left:16px;padding:12px 20px;background:#1ed760;color:#111;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div id="player"></div><div id="message" hidden></div><button id="play-help" hidden onclick="window.waveControl('playVideo');this.hidden=true">▶ Play video</button>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const videoId = params.get('v') || '';
  if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
    document.getElementById('message').hidden=false;
    document.getElementById('message').textContent='Choose a YouTube video from Wave Music to play it here.';
    console.warn('WAVE_PLAYER: missing or invalid video ID');
    return;
  }
  console.info('WAVE_PLAYER: hosted origin='+location.origin);
  window.onYouTubeIframeAPIReady = function(){
    console.info('WAVE_PLAYER: iframe API ready');
    window.wavePlayer = new YT.Player('player',{
      width:'100%',height:'100%',videoId:videoId,
      playerVars:{playsinline:1,rel:0,autoplay:1,origin:location.origin},
      events:{
        onReady:function(e){
          console.info('WAVE_PLAYER: player ready; requesting playback');
          e.target.playVideo();
        },
        onStateChange:function(e){console.info('WAVE_PLAYER: state='+e.data);},
        onError:function(e){console.error('WAVE_PLAYER: YouTube API error='+e.data);},
        onAutoplayBlocked:function(){
          console.warn('WAVE_PLAYER: autoplay blocked; click video to play');
          document.getElementById('play-help').hidden = false;
        }
      }
    });
  };
  window.waveControl = function(action){
    if (window.wavePlayer && (action === 'playVideo' || action === 'pauseVideo')) {
      window.wavePlayer[action]();
    }
  };
  window.addEventListener('error',function(e){console.error('WAVE_PLAYER: JS error='+e.message);});
  const script=document.createElement('script');
  script.src='https://www.youtube.com/iframe_api';
  script.onerror=function(){console.error('WAVE_PLAYER: iframe API script failed');};
  document.head.appendChild(script);
})();
</script>
</body>
</html>
